<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Filter Suggestions Preview</title>
    <link rel="stylesheet" href="../../styles.css" />
    <style>
      :root {
        color-scheme: dark;
        --background-primary: #1f1f1f;
        --background-secondary: #262626;
        --background-modifier-border: #393939;
        --background-modifier-border-hover: #505050;
        --background-modifier-hover: #303030;
        --text-normal: #d7d7d7;
        --text-muted: #a6a6a6;
        --interactive-accent: #8a5cf6;
        --font-ui-small: 0.875rem;
        --font-ui-smaller: 0.75rem;
        --font-ui-medium: 1rem;
        --input-height: 2rem;
        --size-2-3: 0.5rem;
        --size-4-3: 0.875rem;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      body {
        display: grid;
        place-items: start;
        padding: 24px;
        box-sizing: border-box;
        background: #111111;
        font-family: system-ui, sans-serif;
        color: var(--text-normal);
      }

      button {
        justify-content: center;
      }

      .visual-stage {
        position: relative;
        width: 360px;
        height: 560px;
        overflow: visible;
        background:
          radial-gradient(circle at 24% 14%, rgba(255, 255, 255, 0.12) 0 1px, transparent 2px),
          radial-gradient(circle at 72% 30%, rgba(255, 255, 255, 0.1) 0 1px, transparent 2px),
          #101010;
      }

      .visual-stage .reverysky-map-settings-panel {
        display: grid;
      }

      .search-input-container {
        position: relative;
      }

      .search-input-container::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 0.875rem;
        width: 0.875rem;
        height: 0.875rem;
        border: 2px solid var(--text-muted);
        border-radius: 999px;
        transform: translateY(-54%);
        pointer-events: none;
      }

      .search-input-container::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 1.625rem;
        width: 0.5rem;
        height: 2px;
        background: var(--text-muted);
        transform: translateY(0.3125rem) rotate(45deg);
        transform-origin: left center;
        pointer-events: none;
      }

      .search-input {
        box-sizing: border-box;
        width: 100%;
        min-height: 2.375rem;
        border: 1px solid var(--background-modifier-border-hover);
        border-radius: var(--reverysky-control-radius);
        padding: 0.5rem 0.875rem 0.5rem 2.875rem;
        background: var(--background-primary);
        color: var(--text-normal);
        font: inherit;
        outline: none;
        box-shadow: var(--reverysky-control-shadow-focus);
      }

      .visual-stage input[type="range"] {
        appearance: none;
        background: transparent;
        height: 1.75rem;
        margin: -0.25rem 0 0;
        padding: 0;
      }

      .visual-stage input[type="range"]::-webkit-slider-runnable-track {
        height: 0.375rem;
        background: #333333;
        border-radius: 999px;
      }

      .visual-stage input[type="range"]::-webkit-slider-thumb {
        appearance: none;
        width: 1.625rem;
        height: 1.625rem;
        margin-top: -0.625rem;
        border: 1px solid #d7d7d7;
        border-radius: 999px;
        background: #ffffff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.24);
      }
    </style>
  </head>
  <body>
    <div class="visual-stage reverysky-map-root" data-visual-stage>
      <div class="reverysky-map-iframe-host" data-webgl-host aria-hidden="true"></div>

      <div class="reverysky-map-settings-panel">
        <div class="reverysky-map-settings-section reverysky-map-selection-section">
          <div class="reverysky-map-settings-section-header">
            <button class="reverysky-map-settings-section-toggle" type="button" aria-label="Collapse Selection" aria-expanded="true" tabindex="-1">
              <span class="reverysky-map-settings-section-chevron">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </span>
              <span class="reverysky-map-settings-section-title">Selection</span>
            </button>
            <button class="reverysky-map-settings-close" type="button" aria-label="Close filters">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18 6 6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-linecap="round" />
              </svg>
            </button>
          </div>

          <div class="reverysky-map-settings-section-content">
            <div class="reverysky-map-filter-search-area" data-suggestions-anchor>
              <div class="reverysky-map-settings-field-label">Filter</div>
              <div class="search-input-container">
                <input class="search-input" type="search" aria-label="Search in filter" value="date:" />
              </div>
            </div>

            <div class="reverysky-map-filter-message reverysky-map-filter-message--hidden"></div>

            <div class="reverysky-map-tags-toggle-row">
              <div class="reverysky-map-settings-field-label">Tags</div>
              <button class="reverysky-map-tags-toggle" type="button" aria-label="Toggle tags" aria-checked="true">
                <span class="reverysky-map-tags-toggle-thumb"></span>
              </button>
            </div>

            <div class="reverysky-map-settings-section reverysky-map-settings-control-group">
              <div class="reverysky-map-settings-field-label">Layout</div>
              <div class="reverysky-map-engine-select-host">
                <select class="reverysky-map-engine-select" aria-label="Select layout">
                  <option value="auto" selected>Auto</option>
                  <option value="dynamicLinks">Dynamic links (&lt;500 notes)</option>
                  <option value="scalableLinks">Scalable links</option>
                  <option value="dates">Dates</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div class="reverysky-map-settings-section reverysky-map-graphics-section reverysky-map-settings-section--collapsed">
          <div class="reverysky-map-settings-section-header">
            <button class="reverysky-map-settings-section-toggle" type="button" aria-label="Expand Graphics" aria-expanded="false" tabindex="-1">
              <span class="reverysky-map-settings-section-chevron">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </span>
              <span class="reverysky-map-settings-section-title">Graphics</span>
            </button>
          </div>

          <div class="reverysky-map-settings-section-content reverysky-map-settings-section-content--collapsed">
            <div class="reverysky-map-settings-section reverysky-map-settings-control-group reverysky-map-render-scale-section">
              <div class="reverysky-map-render-scale-header">
                <div class="reverysky-map-settings-field-label">Render scale</div>
                <div class="reverysky-map-render-scale-value">1.0x</div>
              </div>
              <input
                class="reverysky-map-render-scale-input"
                type="range"
                min="0.5"
                max="1.5"
                step="0.1"
                value="1"
                aria-label="Render scale"
              />
              <div class="reverysky-map-render-scale-message reverysky-map-render-scale-message--hidden"></div>
            </div>

            <div class="reverysky-map-settings-section reverysky-map-settings-control-group">
              <div class="reverysky-map-settings-field-label">Frame rate</div>
              <div class="reverysky-map-engine-select-host">
                <select class="reverysky-map-engine-select reverysky-map-frame-rate-mode-select" aria-label="Select frame rate">
                  <option value="auto" selected>Auto</option>
                  <option value="fps60">60 FPS</option>
                  <option value="fps30">30 FPS</option>
                  <option value="fps24">24 FPS</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="reverysky-map-filter-suggestions reverysky-map-filter-suggestions--overlay" data-filter-suggestions>
        <div class="reverysky-map-suggestion-title">Date presets</div>
        <div class="reverysky-map-date-suggestion-option" role="button">
          <span class="reverysky-map-date-suggestion-value">date:2026-08-01</span>
          <span class="reverysky-map-date-suggestion-label">= today</span>
        </div>
        <div class="reverysky-map-date-suggestion-option" role="button">
          <span class="reverysky-map-date-suggestion-value">date:&gt;=2026-07-25</span>
          <span class="reverysky-map-date-suggestion-label">&gt;= one week ago</span>
        </div>
        <div class="reverysky-map-date-suggestion-option" role="button">
          <span class="reverysky-map-date-suggestion-value">date:&gt;=2026-07-01</span>
          <span class="reverysky-map-date-suggestion-label">&gt;= one month ago</span>
        </div>
        <div class="reverysky-map-date-suggestion-option" role="button">
          <span class="reverysky-map-date-suggestion-value">date:&gt;=2025-08-01</span>
          <span class="reverysky-map-date-suggestion-label">&gt;= one year ago</span>
        </div>
      </div>
    </div>

    <script>
      const root = document.querySelector(".reverysky-map-root");
      const anchor = document.querySelector("[data-suggestions-anchor]");
      const suggestions = document.querySelector("[data-filter-suggestions]");
      const anchorRect = anchor.getBoundingClientRect();
      const rootRect = root.getBoundingClientRect();
      const gapPx = 4;
      const rootPaddingPx = 8;
      suggestions.style.left = "auto";
      suggestions.style.right = `${rootRect.right - anchorRect.right}px`;
      suggestions.style.top = `${anchorRect.bottom - rootRect.top + gapPx}px`;
      suggestions.style.setProperty("--reverysky-filter-suggestions-anchor-width", `${anchorRect.width}px`);
      suggestions.style.setProperty(
        "--reverysky-filter-suggestions-max-height",
        `${Math.max(0, rootRect.bottom - anchorRect.bottom - gapPx - rootPaddingPx)}px`
      );
    </script>
  </body>
</html>
