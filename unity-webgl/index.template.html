<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ReverySky 3D Graph Runtime</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #231f20;
        color: #dce8ff;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }

      .wrap {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        display: block;
        padding: 0;
      }

      .card {
        width: 100%;
        height: 100%;
        border: 0;
        background: transparent;
        border-radius: 0;
        padding: 0;
        box-sizing: border-box;
        display: block;
        overflow: hidden;
      }

      .canvas-stack {
        position: relative;
        width: 100%;
        height: 100%;
      }

      #map-status {
        position: absolute;
        left: 0.75rem;
        top: 0.75rem;
        z-index: 30;
        display: inline-block;
        width: fit-content;
        max-width: min(50vw, 34rem);
        pointer-events: none;
        box-sizing: border-box;
        padding: 0.32rem 0.46rem;
        border-radius: 0.45rem;
        background: rgba(8, 12, 23, 0.14);
        color: #dce8ff;
        box-shadow: 0 0.18rem 0.6rem rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
      }

      .map-status-content {
        display: block;
      }

      .map-status-line {
        display: block;
      }

      .map-status-value {
        display: block;
        color: rgba(242, 246, 255, 0.96);
        font-size: 0.8rem;
        font-weight: 500;
        line-height: 1.28;
        letter-spacing: 0.01em;
        word-break: break-word;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 0;
        border: 0;
        background: #231f20;
      }

      .canvas-stack canvas {
        position: absolute;
        inset: 0;
      }


    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <div id="canvas-viewport" class="canvas-stack">
          <canvas id="unity-canvas" aria-label="ReverySky 3D Graph runtime"></canvas>
          <div id="map-status" role="status" aria-live="polite" aria-atomic="true">
            <div class="map-status-content">
              <div class="map-status-line">
                <div class="map-status-value" id="map-status-value">Bridge: initializing...</div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script id="unity-build-config" type="application/json">{}</script>
    <script id="unity-loader-source" type="application/octet-stream"></script>
    <script id="unity-framework-source" type="application/octet-stream"></script>
    <script id="unity-data-source" type="application/octet-stream"></script>
    <script id="unity-code-source" type="application/octet-stream"></script>

    <script>
      (function () {
        const protocolVersion = "2.0.0";
        const statusValueEl = document.getElementById("map-status-value");
        const viewportEl = document.getElementById("canvas-viewport");
        const canvas = document.getElementById("unity-canvas");
        const buildPath = "Build/";
        const buildConfigPath = buildPath + "build-config.json";
        const renderScale = getRenderScale();
        const runtimeBootFailureStatus = "Unity runtime failed. Try restarting Obsidian.";
        const webglContextLostStatus = "WebGL context lost. Reload the graph view.";
        const resizeDebounceMs = 200;
        const maxCanvasSidePixels = 8192;
        const maxCanvasPixels = maxCanvasSidePixels * maxCanvasSidePixels;

        let runtimeMode = "boot";
        let unityInstance = null;
        let readySent = false;
        let isShuttingDown = false;
        let latestGraphSetMessage = null;
        let latestGraphSetRequestId = "";
        let latestGraphNoteCount = 0;
        let latestGraphLinkCount = 0;
        let graphSetDispatchToken = 0;
        let latestNoteFocusMessage = null;
        let frameworkBlobUrl = null;
        let dataBlobUrl = null;
        let codeBlobUrl = null;
        let isRuntimeStatusLocked = false;
        let resizeTimerId = 0;
        let resizePendingDuringBoot = false;

        function setStatus(text) {
          if (isRuntimeStatusLocked) {
            return;
          }
          setStatusText(text);
        }

        function setStatusText(text) {
          if (statusValueEl) {
            statusValueEl.textContent = text;
          }
        }

        function formatGraphStatus(noteCount, linkCount, isLoading) {
          return String(noteCount) + " notes, " + String(linkCount) + " links" + (isLoading ? " (loading...)" : "");
        }

        function getEmbeddedText(id) {
          const el = document.getElementById(id);
          return el && typeof el.textContent === "string" ? el.textContent.trim() : "";
        }

        function getRenderScale() {
          const value = Number(new URLSearchParams(window.location.search).get("renderScale"));
          if (!Number.isFinite(value)) {
            return 1;
          }
          const rounded = Math.round(value * 10) / 10;
          return rounded >= 0.5 && rounded <= 1.5 ? rounded : 1;
        }

        function getEffectiveDevicePixelRatio() {
          return (window.devicePixelRatio || 1) * renderScale;
        }

        function base64ToBytes(base64Text) {
          const binary = atob(base64Text);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
          }
          return bytes;
        }

        function base64ToUtf8(base64Text) {
          return new TextDecoder().decode(base64ToBytes(base64Text));
        }

        function base64ToBlob(base64Text, mimeType) {
          return new Blob([base64ToBytes(base64Text)], { type: mimeType });
        }

        function sendReady() {
          if (isShuttingDown || readySent || !window.parent) {
            return;
          }

          readySent = true;
          window.parent.postMessage(
            {
              protocolVersion: protocolVersion,
              type: "bridge:ready",
              requestId: "evt_" + Date.now(),
              payload: {}
            },
            "*"
          );
        }

        function postNoteOpen(id, path) {
          if (isShuttingDown || !window.parent) {
            return;
          }

          const noteId = typeof id === "string" ? id : "";
          const notePath = typeof path === "string" ? path : "";
          window.parent.postMessage(
            {
              protocolVersion: protocolVersion,
              type: "note:open",
              requestId: "evt_" + Date.now(),
              payload: {
                id: noteId,
                path: notePath
              }
            },
            "*"
          );
        }

        function postTagActivate(tag) {
          if (isShuttingDown || !window.parent) {
            return;
          }

          const tagName = typeof tag === "string" ? tag : "";
          window.parent.postMessage(
            {
              protocolVersion: protocolVersion,
              type: "tag:activate",
              requestId: "evt_" + Date.now(),
              payload: {
                tag: tagName
              }
            },
            "*"
          );
        }

        function postGraphReady(requestId) {
          if (isShuttingDown || !window.parent) {
            return;
          }

          window.parent.postMessage(
            {
              protocolVersion: protocolVersion,
              type: "graph:ready",
              requestId: typeof requestId === "string" ? requestId : ""
            },
            "*"
          );
        }

        function postRuntimeScreenshotResponse(payload) {
          if (isShuttingDown || !window.parent) {
            return;
          }

          window.parent.postMessage(
            {
              protocolVersion: protocolVersion,
              type: "runtime:screenshot-response",
              payload: payload
            },
            "*"
          );
        }

        function postRuntimeScreenshotFailure(message) {
          console.warn(message);
          if (isShuttingDown || !window.parent) {
            return;
          }

          postRuntimeScreenshotResponse({
            ok: false
          });
        }

        function waitForNextFrame() {
          return new Promise((resolve) => {
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                resolve();
              });
            });
          });
        }

        async function handleRuntimeScreenshotRequest(data) {
          if (!canvas || typeof canvas.toBlob !== "function") {
            postRuntimeScreenshotFailure("Canvas snapshot is not available.");
            return;
          }

          try {
            await waitForNextFrame();
            const blob = await new Promise((resolve, reject) => {
              canvas.toBlob((snapshot) => {
                if (snapshot) {
                  resolve(snapshot);
                  return;
                }
                reject(new Error("Canvas returned an empty snapshot."));
              }, "image/png");
            });
            postRuntimeScreenshotResponse({
              ok: true,
              blob: blob
            });
          } catch (error) {
            postRuntimeScreenshotFailure(error instanceof Error ? error.message : String(error));
          }
        }

        function resizeCanvas() {
          resizeTimerId = 0;
          if (isShuttingDown || runtimeMode === "failed") {
            return;
          }

          const ratio = getEffectiveDevicePixelRatio();
          const rect = viewportEl.getBoundingClientRect();
          const requestedWidth = Math.max(1, Math.floor(rect.width * ratio));
          const requestedHeight = Math.max(1, Math.floor(rect.height * ratio));
          const requestedPixels = requestedWidth * requestedHeight;
          const pixelBudgetScale =
            requestedPixels > maxCanvasPixels ? Math.sqrt(maxCanvasPixels / requestedPixels) : 1;
          const widthScale =
            requestedWidth > maxCanvasSidePixels ? maxCanvasSidePixels / requestedWidth : 1;
          const heightScale =
            requestedHeight > maxCanvasSidePixels ? maxCanvasSidePixels / requestedHeight : 1;
          const safeScale = Math.min(pixelBudgetScale, widthScale, heightScale);
          const nextWidth = Math.max(1, Math.floor(requestedWidth * safeScale));
          const nextHeight = Math.max(1, Math.floor(requestedHeight * safeScale));
          if (safeScale < 1 && runtimeMode === "unity") {
            console.warn("[ReverySky] Canvas backing buffer was scaled down to stay within the safe pixel budget.");
          }

          if (canvas.width !== nextWidth || canvas.height !== nextHeight) {
            canvas.width = nextWidth;
            canvas.height = nextHeight;
          }
        }

        function scheduleResizeCanvas() {
          if (isShuttingDown || runtimeMode === "failed") {
            return;
          }
          if (runtimeMode === "boot") {
            resizePendingDuringBoot = true;
            return;
          }
          if (resizeTimerId) {
            window.clearTimeout(resizeTimerId);
          }
          resizeTimerId = window.setTimeout(resizeCanvas, resizeDebounceMs);
        }

        function ensureInlineUnityLoader() {
          if (typeof window.createUnityInstance === "function") {
            return;
          }
          const base64Text = getEmbeddedText("unity-loader-source");
          if (!base64Text || base64Text === "__UNITY_LOADER_BASE64__") {
            return;
          }
          const source = base64ToUtf8(base64Text);
          (0, eval)(source + "\n//# sourceURL=unity-loader-inline.js");
        }

        function ensureInlineFrameworkBlobUrl() {
          if (frameworkBlobUrl) {
            return frameworkBlobUrl;
          }
          const base64Text = getEmbeddedText("unity-framework-source");
          if (!base64Text || base64Text === "__UNITY_FRAMEWORK_BASE64__") {
            return null;
          }
          const source = base64ToUtf8(base64Text);
          frameworkBlobUrl = URL.createObjectURL(new Blob([source], { type: "text/javascript" }));
          return frameworkBlobUrl;
        }

        function ensureInlineDataBlobUrl() {
          if (dataBlobUrl) {
            return dataBlobUrl;
          }
          const base64Text = getEmbeddedText("unity-data-source");
          if (!base64Text || base64Text === "__UNITY_DATA_BASE64__") {
            return null;
          }
          dataBlobUrl = URL.createObjectURL(base64ToBlob(base64Text, "application/octet-stream"));
          return dataBlobUrl;
        }

        function ensureInlineCodeBlobUrl() {
          if (codeBlobUrl) {
            return codeBlobUrl;
          }
          const base64Text = getEmbeddedText("unity-code-source");
          if (!base64Text || base64Text === "__UNITY_CODE_BASE64__") {
            return null;
          }
          codeBlobUrl = URL.createObjectURL(base64ToBlob(base64Text, "application/wasm"));
          return codeBlobUrl;
        }

        async function loadBuildConfig() {
          const embedded = getEmbeddedText("unity-build-config");
          if (embedded && embedded !== "__UNITY_BUILD_CONFIG_JSON__") {
            return JSON.parse(embedded);
          }

          if (window.__UNITY_BUILD_CONFIG__ && typeof window.__UNITY_BUILD_CONFIG__ === "object") {
            return window.__UNITY_BUILD_CONFIG__;
          }

          const cfgResp = await fetch(buildConfigPath, { cache: "no-store" });
          if (!cfgResp.ok) {
            throw new Error("build-config is unavailable");
          }
          return cfgResp.json();
        }

        function tryDispatchGraphSetToUnity(message) {
          if (!unityInstance || typeof unityInstance.SendMessage !== "function") {
            return false;
          }

          try {
            unityInstance.SendMessage("ObsidianBridge", "OnGraphSet", JSON.stringify(message));
            return true;
          } catch (e) {
            console.warn("[ReverySky] Failed to dispatch graph:set to Unity:", e);
            return false;
          }
        }

        function tryDispatchNoteFocusToUnity(message) {
          if (!unityInstance || typeof unityInstance.SendMessage !== "function") {
            return false;
          }

          try {
            unityInstance.SendMessage("ObsidianBridge", "OnNoteFocus", JSON.stringify(message));
            return true;
          } catch (e) {
            console.warn("[ReverySky] Failed to dispatch note:focus to Unity:", e);
            return false;
          }
        }

        function tryDispatchRuntimeSettingsToUnity(message) {
          if (!unityInstance || typeof unityInstance.SendMessage !== "function") {
            return false;
          }

          try {
            unityInstance.SendMessage("ObsidianBridge", "OnRuntimeSettings", JSON.stringify(message));
            return true;
          } catch (e) {
            console.warn("[ReverySky] Failed to dispatch runtime:settings to Unity:", e);
            return false;
          }
        }

        function scheduleGraphSetDispatch(message) {
          const dispatchToken = ++graphSetDispatchToken;
          const dispatch = () => {
            if (
              isShuttingDown ||
              dispatchToken !== graphSetDispatchToken ||
              latestGraphSetMessage !== message ||
              runtimeMode !== "unity"
            ) {
              return;
            }

            tryDispatchGraphSetToUnity(message);
          };
          const scheduleDispatch = () => {
            window.setTimeout(dispatch, 0);
          };

          if (typeof window.requestAnimationFrame === "function") {
            window.requestAnimationFrame(scheduleDispatch);
            return;
          }

          scheduleDispatch();
        }

        function applyGraphSet(message) {
          if (isShuttingDown) {
            return;
          }
          if (runtimeMode === "failed") {
            return;
          }

          latestGraphSetMessage = message;
          const payload = message.payload || { notes: [], links: [] };
          const noteCount = payload && payload.vault ? payload.vault.noteCount : (payload.notes || []).length;
          const linkCount = Array.isArray(payload.links) ? payload.links.length : 0;
          latestGraphSetRequestId = typeof message.requestId === "string" ? message.requestId : "";
          latestGraphNoteCount = noteCount;
          latestGraphLinkCount = linkCount;
          setStatus(formatGraphStatus(noteCount, linkCount, true));

          if (runtimeMode === "unity") {
            scheduleGraphSetDispatch(message);
          }
        }

        function applyGraphReady(requestId) {
          if (runtimeMode === "failed") {
            return;
          }

          const readyRequestId = typeof requestId === "string" ? requestId : "";
          if (readyRequestId !== latestGraphSetRequestId) {
            return;
          }

          setStatus(formatGraphStatus(latestGraphNoteCount, latestGraphLinkCount, false));
        }

        function applyRuntimeStatus(message) {
          if (isShuttingDown || runtimeMode === "failed") {
            return;
          }

          const text = message && message.payload && typeof message.payload.text === "string"
            ? message.payload.text.trim()
            : "";
          if (!text) {
            return;
          }

          setStatus(text);
        }

        function applyNoteFocus(message) {
          if (isShuttingDown) {
            return;
          }

          latestNoteFocusMessage = message;
          const payload = message && message.payload ? message.payload : {};
          const id = typeof payload.id === "string" ? payload.id : "";
          const path = typeof payload.path === "string" ? payload.path : "";

          if (runtimeMode === "unity" && tryDispatchNoteFocusToUnity(message)) {
            return;
          }
        }

        function applyRuntimeSettings(message) {
          if (isShuttingDown || runtimeMode !== "unity") {
            return;
          }

          tryDispatchRuntimeSettingsToUnity(message);
        }

        function setRuntimeFailed(statusText) {
          runtimeMode = "failed";
          unityInstance = null;
          graphSetDispatchToken++;
          if (resizeTimerId) {
            window.clearTimeout(resizeTimerId);
            resizeTimerId = 0;
          }
          isRuntimeStatusLocked = true;
          setStatusText(statusText);
        }

        function handleWebglContextLoss() {
          setRuntimeFailed(webglContextLostStatus);
        }

        function onWebglContextLost(event) {
          event.preventDefault();
          console.warn("[ReverySky] WebGL context lost.");
          handleWebglContextLoss();
        }

        function onWindowResize() {
          scheduleResizeCanvas();
        }

        function postShutdownComplete(requestId) {
          if (!window.parent) {
            return;
          }

          window.parent.postMessage(
            {
              protocolVersion: protocolVersion,
              type: "runtime:shutdown-complete",
              requestId: typeof requestId === "string" ? requestId : ""
            },
            "*"
          );
        }

        function beginShutdown(message) {
          const requestId = message && typeof message.requestId === "string" ? message.requestId : "";

          if (isShuttingDown) {
            postShutdownComplete(requestId);
            return;
          }

          isShuttingDown = true;
          runtimeMode = "closing";
          latestGraphSetMessage = null;
          latestGraphSetRequestId = "";
          latestGraphNoteCount = 0;
          latestGraphLinkCount = 0;
          graphSetDispatchToken++;
          latestNoteFocusMessage = null;
          if (resizeTimerId) {
            window.clearTimeout(resizeTimerId);
            resizeTimerId = 0;
          }
          window.ReverySkyBridgePostNoteOpen = function () {};
          window.ReverySkyBridgePostTagActivate = function () {};
          window.ReverySkyBridgePostGraphReady = function () {};
          window.removeEventListener("resize", onWindowResize);
          canvas.removeEventListener("webglcontextlost", onWebglContextLost);

          try {
            if (unityInstance && typeof unityInstance.SendMessage === "function") {
              unityInstance.SendMessage("ObsidianBridge", "OnRuntimeShutdown", JSON.stringify({
                protocolVersion: protocolVersion,
                type: "runtime:shutdown",
                requestId: requestId
              }));
            }
          } catch (e) {
            console.warn("[ReverySky] Failed to notify Unity runtime shutdown:", e);
          }

          postShutdownComplete(requestId);
          window.removeEventListener("message", onBridgeMessage);
        }

        function onBridgeMessage(event) {
          const data = event && event.data;
          if (!data || typeof data !== "object") {
            return;
          }

          if (data.type === "runtime:shutdown") {
            beginShutdown(data);
            return;
          }

          if (isShuttingDown) {
            return;
          }

          if (data.type === "graph:set") {
            applyGraphSet(data);
            return;
          }

          if (data.type === "note:focus") {
            applyNoteFocus(data);
            return;
          }

          if (data.type === "runtime:status") {
            applyRuntimeStatus(data);
            return;
          }

          if (data.type === "runtime:settings") {
            applyRuntimeSettings(data);
            return;
          }

          if (data.type === "runtime:screenshot-request") {
            handleRuntimeScreenshotRequest(data);
          }
        }

        function injectLoaderScript(loaderUrl) {
          return new Promise((resolve, reject) => {
            const s = document.createElement("script");
            s.src = loaderUrl;
            s.onload = () => resolve();
            s.onerror = () => reject(new Error("Failed to load Unity loader: " + loaderUrl));
            document.body.appendChild(s);
          });
        }

        async function tryBootUnityRuntime() {
          const cfg = await loadBuildConfig();
          const loaderUrl = buildPath + cfg.loaderFile;
          const dataUrl = ensureInlineDataBlobUrl() || buildPath + cfg.dataFile;
          const frameworkUrl = ensureInlineFrameworkBlobUrl() || buildPath + cfg.frameworkFile;
          const codeUrl = ensureInlineCodeBlobUrl() || buildPath + cfg.codeFile;

          ensureInlineUnityLoader();
          if (typeof window.createUnityInstance !== "function") {
            await injectLoaderScript(loaderUrl);
          }
          if (typeof window.createUnityInstance !== "function") {
            throw new Error("createUnityInstance is not available");
          }

          unityInstance = await window.createUnityInstance(
            canvas,
            {
              dataUrl: dataUrl,
              frameworkUrl: frameworkUrl,
              codeUrl: codeUrl,
              streamingAssetsUrl: cfg.streamingAssetsUrl || "StreamingAssets",
              companyName: cfg.companyName || "MoonSkorch Studio",
              productName: cfg.productName || "ReverySky Map",
              productVersion: cfg.productVersion || "0.0.0",
              devicePixelRatio: getEffectiveDevicePixelRatio()
            },
            (progress) => {
              setStatus("Unity: loading " + Math.round(progress * 100) + "%");
            }
          );

          if (isShuttingDown) {
            return;
          }

          runtimeMode = "unity";
          setStatus("Unity runtime ready");
          if (resizePendingDuringBoot) {
            resizePendingDuringBoot = false;
            scheduleResizeCanvas();
          }
          sendReady();

          if (latestGraphSetMessage) {
            setStatus(formatGraphStatus(latestGraphNoteCount, latestGraphLinkCount, true));
            scheduleGraphSetDispatch(latestGraphSetMessage);
          }
          if (latestNoteFocusMessage) {
            tryDispatchNoteFocusToUnity(latestNoteFocusMessage);
          }
        }

        async function boot() {
          window.ReverySkyBridgePostNoteOpen = function (noteId, notePath) {
            postNoteOpen(noteId, notePath);
          };
          window.ReverySkyBridgePostTagActivate = function (tag) {
            postTagActivate(tag);
          };
          window.ReverySkyBridgePostGraphReady = function (requestId) {
            postGraphReady(requestId);
            applyGraphReady(requestId);
          };
          window.addEventListener("message", onBridgeMessage);
          canvas.addEventListener("webglcontextlost", onWebglContextLost);
          window.addEventListener("resize", onWindowResize);

          resizeCanvas();

          try {
            await tryBootUnityRuntime();
          } catch (err) {
            setRuntimeFailed(runtimeBootFailureStatus);
            console.error("[ReverySky] Unity runtime boot failed.", err);
          }
        }

        boot();
      })();
    </script>
  </body>
</html>
