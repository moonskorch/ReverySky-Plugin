<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tags Toggle On Preview</title>
    <link rel="stylesheet" href="../../styles.css" />
    <style>
      :root {
        color-scheme: dark;
        --background-primary: #1f1f1f;
        --background-secondary: #262626;
        --background-modifier-border: #393939;
        --background-modifier-border-hover: #505050;
        --background-modifier-hover: #303030;
        --text-normal: #d7d7d7;
        --text-muted: #a6a6a6;
        --interactive-accent: #8a5cf6;
        --font-ui-small: 0.875rem;
        --font-ui-medium: 1rem;
        --input-height: 1.5rem;
        --size-2-3: 0.5rem;
        --size-4-3: 0.875rem;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      body {
        display: grid;
        place-items: start;
        padding: 24px;
        box-sizing: border-box;
        background: #111111;
        font-family: system-ui, sans-serif;
        color: var(--text-normal);
      }

      .visual-stage {
        position: relative;
        width: 160px;
        height: 112px;
        display: grid;
        place-items: center;
      }
    </style>
  </head>
  <body>
    <div class="visual-stage reverysky-map-root" data-visual-stage>
      <button
        class="reverysky-map-tags-toggle"
        type="button"
        aria-label="Toggle tags"
        aria-checked="true"
        role="switch"
      >
        <span class="reverysky-map-tags-toggle-thumb"></span>
      </button>
    </div>
  </body>
</html>
