<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Render Scale Message Preview</title>
    <link rel="stylesheet" href="../../styles.css" />
    <style>
      :root {
        color-scheme: dark;
        --background-primary: #1f1f1f;
        --background-secondary: #262626;
        --background-modifier-border: #393939;
        --background-modifier-border-hover: #505050;
        --background-modifier-hover: #303030;
        --text-normal: #d7d7d7;
        --text-muted: #a6a6a6;
        --font-ui-small: 0.875rem;
        --font-ui-smaller: 0.75rem;
        --font-ui-medium: 1rem;
        --input-height: 2rem;
        --size-2-3: 0.5rem;
        --size-4-3: 0.875rem;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      body {
        display: grid;
        place-items: start;
        padding: 24px;
        box-sizing: border-box;
        background: #111111;
        font-family: system-ui, sans-serif;
        color: var(--text-normal);
      }

      .visual-stage {
        position: relative;
        width: 384px;
        height: 180px;
        overflow: visible;
      }

      .visual-message-shell {
        box-sizing: border-box;
        width: 360px;
        padding: 0.625rem 0.875rem 0.75rem;
        background: var(--background-secondary);
        border: var(--reverysky-panel-border);
        border-radius: 0.625rem;
      }

      .visual-message-shell input[type="range"] {
        appearance: none;
        background: transparent;
        height: 1.75rem;
        margin: -0.25rem 0 0;
        padding: 0;
      }

      .visual-message-shell input[type="range"]::-webkit-slider-runnable-track {
        height: 0.375rem;
        background: #333333;
        border-radius: 999px;
      }

      .visual-message-shell input[type="range"]::-webkit-slider-thumb {
        appearance: none;
        width: 1.625rem;
        height: 1.625rem;
        margin-top: -0.625rem;
        border: 1px solid #d7d7d7;
        border-radius: 999px;
        background: #ffffff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.24);
      }
    </style>
  </head>
  <body>
    <div class="visual-stage" data-visual-stage>
      <div class="reverysky-map-root">
        <div class="visual-message-shell">
          <div class="reverysky-map-filter-section-content">
            <div class="reverysky-map-filter-section reverysky-map-filter-control-group reverysky-map-render-scale-section">
              <div class="reverysky-map-render-scale-header">
                <div class="reverysky-map-filter-field-label">Render scale</div>
                <div class="reverysky-map-render-scale-value">1.3x</div>
              </div>
              <input
                class="reverysky-map-render-scale-input"
                type="range"
                min="0.5"
                max="1.5"
                step="0.1"
                value="1.3"
                aria-label="Render scale"
              />
              <div class="reverysky-map-render-scale-message">Reopen the graph view to apply.</div>
            </div>

            <div class="reverysky-map-filter-section reverysky-map-filter-control-group">
              <div class="reverysky-map-filter-field-label">Frame rate</div>
              <div class="reverysky-map-engine-select-host">
                <select class="reverysky-map-engine-select reverysky-map-frame-rate-mode-select" aria-label="Select frame rate">
                  <option value="auto" selected>Auto</option>
                  <option value="fps60">60 FPS</option>
                  <option value="fps30">30 FPS</option>
                  <option value="fps24">24 FPS</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
