<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Layout Dropdown Preview</title>
    <link rel="stylesheet" href="../../styles.css" />
    <style>
      :root {
        color-scheme: dark;
        --background-primary: #1f1f1f;
        --background-secondary: #262626;
        --background-modifier-border: #393939;
        --background-modifier-border-hover: #505050;
        --background-modifier-hover: #303030;
        --text-normal: #d7d7d7;
        --text-muted: #a6a6a6;
        --font-ui-small: 0.875rem;
        --font-ui-medium: 1rem;
        --size-2-3: 0.5rem;
        --size-4-3: 0.875rem;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      body {
        display: grid;
        place-items: start;
        padding: 24px;
        box-sizing: border-box;
        background: #111111;
        font-family: system-ui, sans-serif;
        color: var(--text-normal);
      }

      .visual-stage {
        position: relative;
        width: 424px;
        height: 136px;
        overflow: visible;
      }

      .visual-dropdown-shell {
        box-sizing: border-box;
        width: 360px;
        margin: 20px 0 0 20px;
        padding: 0.625rem 0.875rem;
        background: var(--background-secondary);
        border: var(--reverysky-panel-border);
        border-radius: 0.625rem;
      }
    </style>
  </head>
  <body>
    <div class="visual-stage" data-visual-stage>
      <div class="reverysky-map-root">
        <div class="visual-dropdown-shell">
          <div class="reverysky-map-settings-section reverysky-map-settings-control-group">
            <div class="reverysky-map-settings-field-label">Layout</div>
            <div class="reverysky-map-engine-select-host">
              <select class="reverysky-map-engine-select" aria-label="Select layout">
                <option value="auto" selected>Auto</option>
                <option value="dynamicLinks">Dynamic links (&lt;500 notes)</option>
                <option value="scalableLinks">Scalable links</option>
                <option value="dates">Dates</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
